#!/usr/sbin/nft -f

flush ruleset

table inet defense_in_depth {
  chain input {
    type filter hook input priority filter; policy drop;

    iifname "lo" accept
    ct state invalid drop
    ct state established,related accept

    # ICMP bleibt fuer Diagnose und korrektes IPv6-Verhalten erlaubt.
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    # Einziger von aussen erreichbarer Dienst im Labor.
    tcp dport 22 ct state new accept

    limit rate 5/minute burst 10 packets log prefix "DID-DROP " level info
    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
