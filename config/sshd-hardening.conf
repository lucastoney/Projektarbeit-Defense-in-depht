# Defense-in-Depth-Labor: Passwortauthentifizierung bleibt nur fuer die
# Fail2ban-Demonstration aktiv. Produktiv sind SSH-Schluessel vorzuziehen.
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
AllowUsers labuser vagrant
UsePAM yes
